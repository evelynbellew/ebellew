<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evelyn Bellew</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-body: Georgia, 'Times New Roman', serif;
      --font-ui:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --color-text:    #111;
      --color-muted:   #555;
      --color-link:    #1a0dab;
      --color-rule:    #ccc;
      --color-bg:      #fff;
      --sidebar-width: 280px;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.65;
      display: flex;
      min-height: 100vh;
      padding: 0;
    }

    a { color: var(--color-link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Fixed left sidebar ── */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      padding: 2rem 1.5rem 2rem 2rem;
      border-right: 1px solid var(--color-rule);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Photo at top of sidebar */
    .sidebar-photo {
      width: 100%;
      margin-bottom: 1.25rem;
    }
    .sidebar-photo img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .sidebar h1 {
      font-size: 1.05rem;
      font-weight: bold;
      font-family: var(--font-body);
      margin-bottom: 0.25rem;
      line-height: 1.3;
      color: var(--color-text);
    }

    .sidebar h1 a {
      color: inherit;
      text-decoration: none;
      pointer-events: none;
      cursor: default;
    }

    .sidebar .sidebar-meta {
      font-size: 0.78rem;
      color: var(--color-muted);
      font-family: var(--font-ui);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }

    /* Nav links */
    .site-nav {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-family: var(--font-ui);
      font-size: 0.85rem;
    }

    /* ── Main scrollable content ── */
    .main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 2.5rem 5rem 5rem 3rem;
    }

    /* Right margin: small fixed gutter */
    .main-content > * {
      max-width: calc(100% - 1.5rem);
    }

    /* ── Bio ── */
    .bio {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .bio p { margin-bottom: 0.75rem; }
    .bio .cv-link { font-weight: bold; }
